<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy & Ticoh - Fixed Initialization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        const PARTICLE_COUNT = 8000; 
        const COLORS = [
            'rgba(255, 40, 80, 0.95)',   
            'rgba(40, 255, 130, 0.95)',  
            'rgba(180, 40, 255, 0.95)',  
            'rgba(255, 220, 40, 0.95)',  
            'rgba(40, 220, 255, 0.95)'   
        ];

        let width = 0;
        let height = 0;
        let currentState = 0; 
        let stateTimer = 0;
        let particles = [];

        const targets = {
            text: [],
            heart: []
        };

        // Parametric Heart Formula
        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * scale, y: -y * scale };
        }

        // Guarantees clean coordinates even if browser lags at loading
        function generateTargets() {
            targets.text = [];
            targets.heart = [];

            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;

            // Secure minimum window sizing fallback
            if(width === 0) width = canvas.width = 800;
            if(height === 0) height = canvas.height = 600;

            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = width;
            offCanvas.height = height;
            
            const fontSize = Math.min(width / 7, 90);
            offCtx.font = `bold ${fontSize}px sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillStyle = '#ffffff'; 
            offCtx.fillText("Joy ❤ Ticoh", width / 2, height / 2);

            try {
                const imgData = offCtx.getImageData(0, 0, width, height).data;
                const step = width < 768 ? 2 : 3; 

                for (let y = 0; y < height; y += step) {
                    for (let x = 0; x < width; x += step) {
                        const index = (y * width + x) * 4;
                        // Checking Alpha channel or Red channel for structural integrity
                        if (imgData[index + 3] > 128 || imgData[index] > 200) { 
                            targets.text.push({ x: x, y: y });
                        }
                    }
                }
            } catch (e) {
                console.error("Scanning restriction: ", e);
            }

            // Absolute structural fallback if device restricts canvas reading
            if (targets.text.length === 0) {
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    targets.text.push({
                        x: width / 2 + (Math.random() - 0.5) * (width * 0.7),
                        y: height / 2 + (Math.random() - 0.5) * 50
                    });
                }
            }

            // Build structural heart targets
            const heartScale = Math.min(width, height) / 42;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.PI * 2 * (i / PARTICLE_COUNT);
                const basePoint = getHeartPoint(t, heartScale);
                const innerFactor = Math.random() * 0.35 + 0.65; 
                
                targets.heart.push({ 
                    x: width / 2 + basePoint.x * innerFactor, 
                    y: height / 2 + basePoint.y * innerFactor 
                });
            }

            targets.text.sort(() => Math.random() - 0.5);
        }

        class Particle {
            constructor() {
                this.x = Math.random() * (window.innerWidth || 800);
                this.y = Math.random() * (window.innerHeight || 600);
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 1.5 + 0.8;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.ease = 0.08;
            }

            update(index) {
                if (currentState === 0) {
                    // Phase 0: 1.5s Starfield Delay
                    this.vx *= 0.99;
                    this.vy *= 0.99;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                }
                else if (currentState === 1) {
                    // Phase 1: Lock into Text
                    const target = targets.text[index % targets.text.length];
                    if (target) {
                        this.vx += (target.x - this.x) * this.ease;
                        this.vy += (target.y - this.y) * this.ease;
                    }
                    this.vx *= 0.82; 
                    this.vy *= 0.82;
                } 
                else if (currentState === 2) {
                    // Phase 2: Screen Explosion Burst
                    this.vx *= 0.99; 
                    this.vy *= 0.99;
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                } 
                else if (currentState === 3) {
                    // Phase 3: Morph into Heart
                    const target = targets.heart[index % targets.heart.length];
                    if (target) {
                        const beat = 1 + Math.sin(Date.now() * 0.005) * 0.04;
                        const centerX = width / 2;
                        const centerY = height / 2;
                        
                        const dynamicX = centerX + (target.x - centerX) * beat;
                        const dynamicY = centerY + (target.y - centerY) * beat;

                        this.vx += (dynamicX - this.x) * (this.ease * 0.7);
                        this.vy += (dynamicY - this.y) * (this.ease * 0.7);
                    }
                    this.vx *= 0.85;
                    this.vy *= 0.85;
                }

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            explode() {
                const angle = Math.random() * Math.PI * 2;
                const force = Math.random() * 25 + 8; 
                this.vx = Math.cos(angle) * force;
                this.vy = Math.sin(angle) * force;
            }

            resetDrift() {
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = (Math.random() - 0.5) * 3;
            }
        }

        // Dedicated Init engine wrapped inside a window load listener 
        function init() {
            generateTargets();
            
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
            
            // Starts loop calculation safely
            animate();
        }

        window.addEventListener('load', init);
        window.addEventListener('resize', generateTargets);

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.22)';
            ctx.fillRect(0, 0, width, height);

            stateTimer++;

            if (currentState === 0 && stateTimer > 90) {
                currentState = 1;
                stateTimer = 0;
            } 
            else if (currentState === 1 && stateTimer > 210) {
                currentState = 2;
                stateTimer = 0;
                particles.forEach(p => p.explode());
            } 
            else if (currentState === 2 && stateTimer > 150) {
                currentState = 3;
                stateTimer = 0;
            } 
            else if (currentState === 3 && stateTimer > 450) {
                currentState = 0;
                stateTimer = 0;
                particles.forEach(p => p.resetDrift());
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].update(i);
                particles[i].draw();
            }

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
