<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Round Particle Heart & Halo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .text-container {
            position: absolute;
            top: 8%;
            text-align: center;
            z-index: 2;
            width: 100%;
            pointer-events: none;
        }
        h1 {
            color: #4da6ff;
            font-size: 3.5rem;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff, 0 0 40px #0044cc;
            animation: pulse 2s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from { text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff; transform: scale(1); }
            to { text-shadow: 0 0 20px #3399ff, 0 0 40px #0066ff, 0 0 60px #002288; transform: scale(1.02); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="text-container">
        <h1>I Love You</h1>
    </div>

    <script>
        // --- 1. SETUP THREE.JS SCENE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 24;
        camera.position.y = 2;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Helper function to generate a bright star/glow texture
        const createParticleTexture = (coreColor, glowColor) => {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.2, coreColor);
            grad.addColorStop(0.5, glowColor);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        };

        const heartTexture = createParticleTexture('rgba(100,200,255,0.8)', 'rgba(0,102,255,0.4)');
        const haloTexture = createParticleTexture('rgba(0,255,255,0.9)', 'rgba(0,150,255,0.3)');

        // --- 2. CREATE A PUFFY, ROUNDED 3D PARTICLE SURFACE HEART ---
        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        const heartParticleCount = 4500;
        const heartGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(heartParticleCount * 3);
        const sizes = new Float32Array(heartParticleCount);

        // Generate a true 3D spherical-morphed heart surface shell (Puffy & Round)
        for (let i = 0; i < heartParticleCount; i++) {
            // Spherical coordinate sampling
            const theta = Math.PI * Math.random();
            const phi = 2 * Math.PI * Math.random();

            // 3D Taubin Heart Equation Surface Mapping
            // Keeps the coordinates locked strictly to a rounded outer skin
            const sinT = Math.sin(theta);
            const cosT = Math.cos(theta);
            const sinP = Math.sin(phi);
            const cosP = Math.cos(phi);

            // Parametric equations for a beautiful 3D puffy heart shape
            let x = 12 * sinT * sinP;
            let y = 11 * cosT - 3 * Math.pow(sinT * sinP, 2); // Pulls center down into a cleavage curve
            let z = 7 * sinT * cosP * (1 - Math.abs(sinP) * 0.4); // Limits depth for round proportions

            // Add slight organic noise to simulate a shimmering outer dust cloud
            const noise = 1 + (Math.random() - 0.5) * 0.06;

            positions[i * 3] = x * noise * 0.6;
            positions[i * 3 + 1] = y * noise * 0.6; // Correct side up natively
            positions[i * 3 + 2] = z * noise * 0.6;

            sizes[i] = Math.random() * 0.4 + 0.15; // Star sizes
        }

        heartGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const heartMaterial = new THREE.PointsMaterial({
            size: 0.45,
            map: heartTexture,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false,
            opacity: 0.95
        });

        const heartPoints = new THREE.Points(heartGeometry, heartMaterial);
        heartGroup.add(heartPoints);
        
        // Position centering tweak
        heartGroup.position.y = 1.5;

        // --- 3. CREATE THE TIGHT SNAKE HALO ---
        const haloParticleCount = 350;
        const haloGeometry = new THREE.BufferGeometry();

        const haloMaterial = new THREE.PointsMaterial({
            size: 0.5,
            map: haloTexture,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });

        const snakeHalo = new THREE.Points(haloGeometry, haloMaterial);
        scene.add(snakeHalo);

        // --- 4. GLOWING BASE REFLECTION POOL ---
        const floorGeo = new THREE.PlaneGeometry(25, 25);
        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 256;
        floorCanvas.height = 256;
        const floorCtx = floorCanvas.getContext('2d');
        const floorGrad = floorCtx.createRadialGradient(128, 128, 0, 128, 128, 100);
        floorGrad.addColorStop(0, 'rgba(0, 130, 255, 0.45)');
        floorGrad.addColorStop(0.6, 'rgba(0, 40, 180, 0.12)');
        floorGrad.addColorStop(1, 'rgba(0,0,0,0)');
        floorCtx.fillStyle = floorGrad;
        floorCtx.fillRect(0, 0, 256, 256);

        const floorMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(floorCanvas),
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.position.y = -7.5;
        scene.add(floorMesh);

        // --- 5. ANIMATION LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Smooth 3D Heart Rotation (Right-side up)
            heartGroup.rotation.y = elapsedTime * 0.4;
            
            // Weightless vertical floating bob
            heartGroup.position.y = 1.5 + Math.sin(elapsedTime * 1.3) * 0.35;

            // Twinkle Effect: Add subtle cosmic breathing variation to heart star sizes
            heartMaterial.size = 0.45 + Math.sin(elapsedTime * 4) * 0.05;

            // Animate the Snake Halo Ring underneath the sharp point of the heart
            const haloPosArr = new Float32Array(haloParticleCount * 3);
            const haloRadius = 4.2; // Small localized ring right under the tip

            for (let i = 0; i < haloParticleCount; i++) {
                // Wrap points along a circular loop over time
                const angle = (i / haloParticleCount) * Math.PI * 2 + (elapsedTime * 1.5);
                
                // Fast slithering wave movement up and down like a snake
                const snakeWave = Math.sin(i * 0.18 - elapsedTime * 8) * 0.35;
                // Minor breathing pulse depth on the ring radius
                const dynamicRadius = haloRadius + Math.cos(i * 0.08 + elapsedTime * 3) * 0.15;

                haloPosArr[i * 3] = Math.cos(angle) * dynamicRadius;
                // Positioned right at the base reflection plane level (-6.5 height)
                haloPosArr[i * 3 + 1] = -6.2 + snakeWave; 
                haloPosArr[i * 3 + 2] = Math.sin(angle) * dynamicRadius;
            }
            snakeHalo.geometry.setAttribute('position', new THREE.BufferAttribute(haloPosArr, 3));

            renderer.render(scene, camera);
        }

        // Window resize adjustment
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
