<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy & Ticoh - 15s Loop with Delay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        const PARTICLE_COUNT = 9000; 
        const COLORS = [
            'rgba(255, 40, 80, 0.95)',   
            'rgba(40, 255, 130, 0.95)',  
            'rgba(180, 40, 255, 0.95)',  
            'rgba(255, 220, 40, 0.95)',  
            'rgba(40, 220, 255, 0.95)'   
        ];

        // New State Order: 0 = Initial Delay (Stars), 1 = Names, 2 = Explode, 3 = Heart
        let currentState = 0; 
        let stateTimer = 0;

        const targets = {
            text: [],
            heart: []
        };

        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * scale, y: -y * scale };
        }

        function generateTargets() {
            targets.text = [];
            targets.heart = [];

            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            
            const fontSize = Math.min(canvas.width / 7, 90);
            offCtx.font = `bold ${fontSize}px sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillStyle = '#ffffff'; 
            offCtx.fillText("Joy ❤ Ticoh", canvas.width / 2, canvas.height / 2);

            try {
                const imgData = offCtx.getImageData(0, 0, canvas.width, canvas.height).data;
                const step = canvas.width < 768 ? 2 : 3; 

                for (let y = 0; y < canvas.height; y += step) {
                    for (let x = 0; x < canvas.width; x += step) {
                        const index = (y * canvas.width + x) * 4;
                        if (imgData[index] > 200) { 
                            targets.text.push({ x: x, y: y });
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }

            const heartScale = Math.min(canvas.width, canvas.height) / 42;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.PI * 2 * (i / PARTICLE_COUNT);
                const basePoint = getHeartPoint(t, heartScale);
                const innerFactor = Math.random() * 0.35 + 0.65; 
                
                targets.heart.push({ 
                    x: canvas.width / 2 + basePoint.x * innerFactor, 
                    y: canvas.height / 2 + basePoint.y * innerFactor 
                });
            }

            targets.text.sort(() => Math.random() - 0.5);
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                // Give particles an initial slow drift velocity for the delay phase
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 1.5 + 0.8;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.ease = 0.08;
            }

            update(index) {
                if (currentState === 0) {
                    // Phase 0: 1.5s Starfield Delay (Drifting peacefully)
                    this.vx *= 0.99;
                    this.vy *= 0.99;
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                }
                else if (currentState === 1) {
                    // Phase 1: Lock into Crisp Text
                    const target = targets.text[index % targets.text.length];
                    if (target) {
                        this.vx += (target.x - this.x) * this.ease;
                        this.vy += (target.y - this.y) * this.ease;
                    }
                    this.vx *= 0.82; 
                    this.vy *= 0.82;
                } 
                else if (currentState === 2) {
                    // Phase 2: Massive Full-Screen Explosion
                    this.vx *= 0.99; 
                    this.vy *= 0.99;
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                } 
                else if (currentState === 3) {
                    // Phase 3: Pull together into Pulsing Heart
                    const target = targets.heart[index % targets.heart.length];
                    if (target) {
                        const beat = 1 + Math.sin(Date.now() * 0.005) * 0.04;
                        const centerX = canvas.width / 2;
                        const centerY = canvas.height / 2;
                        
                        const dynamicX = centerX + (target.x - centerX) * beat;
                        const dynamicY = centerY + (target.y - centerY) * beat;

                        this.vx += (dynamicX - this.x) * (this.ease * 0.7);
                        this.vy += (dynamicY - this.y) * (this.ease * 0.7);
                    }
                    this.vx *= 0.85;
                    this.vy *= 0.85;
                }

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            explode() {
                const angle = Math.random() * Math.PI * 2;
                const force = Math.random() * 25 + 8; 
                this.vx = Math.cos(angle) * force;
                this.vy = Math.sin(angle) * force;
            }

            resetDrift() {
                // Instantly assign soft drift movement when converting back to starfield
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = (Math.random() - 0.5) * 3;
            }
        }

        const particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        generateTargets();
        window.addEventListener('resize', () => {
            resizeCanvas();
            generateTargets();
        });

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.22)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
