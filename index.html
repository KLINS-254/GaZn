<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color-Changing Particle Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const config = {
            heartScale: 14,          
            particleCount: 5,       // Slightly more particles for richer dust clouds
        };

        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x, y };
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color; // Captures the exact color of the beam at creation time
                this.vx = (Math.random() - 0.5) * 7;
                this.vy = (Math.random() - 0.5) * 7;
                this.size = Math.random() * 2.5 + 1;
                this.alpha = 1;
                this.decay = Math.random() * 0.012 + 0.005;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.94;
                this.vy *= 0.94;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        let heartPoints = [];
        let traceIndex = 0;
        
        for (let t = 0; t <= Math.PI; t += 0.01) {
            heartPoints.push(t);
        }

        const finalizedPath = [];

        function animate() {
            // Keep trails dark and smooth
            ctx.fillStyle = 'rgba(5, 5, 8, 0.12)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 20;

            // 1. Trace Phase with dynamic color shifting
            if (traceIndex < heartPoints.length) {
                const t = heartPoints[traceIndex];
                
                // Calculate color shifting (0% progress = Green, 50% = Orange/Yellow, 100% = Pink/Purple)
                const progress = traceIndex / heartPoints.length;
                // Green starts around hue 130, Orange is ~30, Purple is ~290
                // This formula cycles smoothly: Green (130) -> Yellow/Orange (40) -> Pink/Purple (300)
                let hue;
                if (progress < 0.5) {
                    // Transition from Green (130) down to Orange (30)
                    hue = 130 - (progress * 2) * 100;
                } else {
                    // Transition from Orange (30) up to Purple (290)
                    hue = 30 + ((progress - 0.5) * 2) * 260;
                }
                
                const currentColor = `hsl(${hue}, 100%, 65%)`;

                const ptLeft = getHeartPoint(-t);
                const xl = centerX + ptLeft.x * config.heartScale;
                const yl = centerY + ptLeft.y * config.heartScale;

                const ptRight = getHeartPoint(t);
                const xr = centerX + ptRight.x * config.heartScale;
                const yr = centerY + ptRight.y * config.heartScale;

                // Save coordinates along with its specific color
                finalizedPath.push({xl, yl, xr, yr, color: currentColor});

                // Spawn dust matching the current color segment
                for (let i = 0; i < config.particleCount; i++) {
                    particles.push(new Particle(xl, yl, currentColor));
                    particles.push(new Particle(xr, yr, currentColor));
                }

                // Bright leading white spark
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#fff';
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(xl, yl, 4, 0, Math.PI*2);
                ctx.arc(xr, yr, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();

                traceIndex += 1; 
            }

            // 2. Update and draw existing particles
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            // 3. Draw the solid glowing multicolored neon line
            if (finalizedPath.length > 0) {
                ctx.save();
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // We segment the line drawing so each tiny line piece preserves its exact color stage
                for (let i = 1; i < finalizedPath.length; i++) {
                    const prev = finalizedPath[i - 1];
                    const curr = finalizedPath[i];

                    ctx.strokeStyle = curr.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = curr.color;

                    // Draw Left segment
                    ctx.beginPath();
                    ctx.moveTo(prev.xl, prev.yl);
                    ctx.lineTo(curr.xl, curr.yl);
                    ctx.stroke();

                    // Draw Right segment
                    ctx.beginPath();
                    ctx.moveTo(prev.xr, prev.yr);
                    ctx.lineTo(curr.xr, curr.yr);
                    ctx.stroke();
                }
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
