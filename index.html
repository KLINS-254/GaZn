<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Heart & Halo Snake Ring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .text-container {
            position: absolute;
            top: 8%;
            text-align: center;
            z-index: 2;
            width: 100%;
            pointer-events: none;
        }
        h1 {
            color: #4da6ff;
            font-size: 3.5rem;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff, 0 0 40px #0044cc;
            animation: pulse 2s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from { text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff; transform: scale(1); }
            to { text-shadow: 0 0 20px #3399ff, 0 0 40px #0066ff, 0 0 60px #002288; transform: scale(1.02); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="text-container">
        <h1>I Love You</h1>
    </div>

    <script>
        // --- 1. SETUP THREE.JS SCENE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 28;
        camera.position.y = 4;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. CREATE A SOLID DEFINED 3D HEART ---
        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        // Define a smooth 2D shape of a heart using standard Bezier curves
        const heartShape = new THREE.Shape();
        heartShape.moveTo(0, 3.7);
        heartShape.bezierCurveTo(2.5, 7.5, 7.5, 7.5, 7.5, 3.7);
        heartShape.bezierCurveTo(7.5, 0, 4.5, -4.5, 0, -8.5);
        heartShape.bezierCurveTo(-4.5, -4.5, -7.5, 0, -7.5, 3.7);
        heartShape.bezierCurveTo(-7.5, 7.5, -2.5, 7.5, 0, 3.7);

        // Extrude the 2D heart shape into 3D geometry (giving it solid walls and depth)
        const extrudeSettings = {
            depth: 3,
            bevelEnabled: true,
            bevelSegments: 5,
            steps: 2,
            bevelSize: 1,
            bevelThickness: 1
        };

        const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        heartGeometry.center(); // Center geometry on its local axis
        
        // Use a mesh material that looks structural and clean, with a neon wireframe/point mesh overlay
        const heartMaterial = new THREE.MeshBasicMaterial({
            color: 0x0033aa,
            wireframe: true,
            transparent: true,
            opacity: 0.4
        });
        
        const heartMesh = new THREE.Mesh(heartGeometry, heartMaterial);
        heartGroup.add(heartMesh);

        // Add bright points on top of the mesh vertices so it still has a magical glow, but keeps the shape rigid
        const pointMaterial = new THREE.PointsMaterial({
            color: 0x33aaff,
            size: 0.25,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const heartPoints = new THREE.Points(heartGeometry, pointMaterial);
        heartGroup.add(heartPoints);

        // Flip it right side up and scale
        heartGroup.rotation.z = Math.PI;
        heartGroup.scale.set(1.1, 1.1, 1.1);
        heartGroup.position.y = 3;

        // --- 3. CREATE THE TIGHT SNAKE HALO ---
        const ringParticleCount = 300;
        const ringGeometry = new THREE.BufferGeometry();
        
        // Helper texture for glowing particles
        const createParticleTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.4, 'rgba(0,180,255,0.8)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 16, 16);
            return new THREE.CanvasTexture(canvas);
        };

        const ringMaterial = new THREE.PointsMaterial({
            color: 0x00ffff,
            size: 0.4,
            map: createParticleTexture(),
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });

        const snakeRing = new THREE.Points(ringGeometry, ringMaterial);
        scene.add(snakeRing);

        // --- 4. GLOWING BASE REFLECTION POOL ---
        const floorGeo = new THREE.PlaneGeometry(25, 25);
        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 256;
        floorCanvas.height = 256;
        const floorCtx = floorCanvas.getContext('2d');
        const floorGrad = floorCtx.createRadialGradient(128, 128, 0, 128, 128, 100);
        floorGrad.addColorStop(0, 'rgba(0, 102, 255, 0.5)');
        floorGrad.addColorStop(0.6, 'rgba(0, 40, 150, 0.15)');
        floorGrad.addColorStop(1, 'rgba(0,0,0,0)');
        floorCtx.fillStyle = floorGrad;
        floorCtx.fillRect(0, 0, 256, 256);

        const floorMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(floorCanvas),
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.position.y = -7.5;
        scene.add(floorMesh);


        // --- 5. ANIMATION LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // A. Continuous clean 3D heart rotation (Y-axis)
            heartGroup.rotation.y = elapsedTime * 0.5;
            
            // Weightless vertical floating bobbing effect
            heartGroup.position.y = 3 + Math.sin(elapsedTime * 1.5) * 0.4;

            // B. Animate the Tight "Snake Halo" Ring under the heart
            const ringPosArr = new Float32Array(ringParticleCount * 3);
            
            // Smaller radius so it looks like a tight halo localized right under the point
            const haloRadius = 5.5; 

            for (let i = 0; i < ringParticleCount; i++) {
                // Loop the points along a circle path over time
                const angle = (i / ringParticleCount) * Math.PI * 2 + (elapsedTime * 1.2);
                
                // Fast slithering motion up and down
                const snakeWave = Math.sin(i * 0.15 - elapsedTime * 7) * 0.4;
                // Tight pulsing variation on the halo's radius
                const dynamicRadius = haloRadius + Math.cos(i * 0.1 + elapsedTime * 3) * 0.2;

                ringPosArr[i * 3] = Math.cos(angle) * dynamicRadius;
                // Positioned perfectly under the heart tip (-6.5 position)
                ringPosArr[i * 3 + 1] = -6.5 + snakeWave; 
                ringPosArr[i * 3 + 2] = Math.sin(angle) * dynamicRadius;
            }
            snakeRing.geometry.setAttribute('position', new THREE.BufferAttribute(ringPosArr, 3));

            renderer.render(scene, camera);
        }

        // Window resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
