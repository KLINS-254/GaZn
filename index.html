<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joy & Ticoh Particle Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        // Resize Canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Configuration
        const PARTICLE_COUNT = 12000; // Maintained high count for maximum density
        const COLORS = [
            'rgba(255, 40, 80, 0.85)',   // Red
            'rgba(40, 255, 130, 0.85)',  // Green
            'rgba(180, 40, 255, 0.85)',  // Purple
            'rgba(255, 200, 40, 0.85)',  // Gold/Yellow
            'rgba(40, 210, 255, 0.85)'   // Cyan
        ];

        // Animation States: 0 = Text (Joy ❤ Ticoh), 1 = Explode/Scatter, 2 = Heart
        let currentState = 0; 
        let stateTimer = 0;

        const targets = {
            text: [],
            heart: []
        };

        // --- Math & Shape Helpers ---
        
        // Heart Math Equation (Parametric)
        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * scale, y: -y * scale };
        }

        // Generate Target Coordinates for Text and Heart
        function generateTargets() {
            targets.text = [];
            targets.heart = [];

            // 1. Generate Text Targets using an offscreen canvas
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            
            // Render text cleanly using a balanced dynamic font scale
            const fontSize = Math.min(canvas.width / 10, 85);
            offCtx.font = `bold ${fontSize}px sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillStyle = 'white';
            offCtx.fillText("Joy ❤ Ticoh", canvas.width / 2, canvas.height / 2);

            const imgData = offCtx.getImageData(0, 0, canvas.width, canvas.height).data;
            
            // Scan text pixels using a tight step value to keep the complex text shapes clear
            const step = Math.max(1, Math.floor(Math.sqrt((canvas.width * canvas.height) / PARTICLE_COUNT) * 0.65));
            for (let y = 0; y < canvas.height; y += step) {
                for (let x = 0; x < canvas.width; x += step) {
                    const index = (y * canvas.width + x) * 4;
                    if (imgData[index + 3] > 128) { 
                        targets.text.push({ x: x, y: y });
                    }
                }
            }

            // 2. Generate Heart Targets
            const heartScale = Math.min(canvas.width, canvas.height) / 45;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.PI * 2 * (i / PARTICLE_COUNT);
                const basePoint = getHeartPoint(t, heartScale);
                
                // Add internal scattering so it forms a gorgeous solid core heart
                const innerFactor = Math.random() * 0.25 + 0.75; 
                const hX = canvas.width / 2 + basePoint.x * innerFactor;
                const hY = canvas.height / 2 + basePoint.y * innerFactor;
                
                targets.heart.push({ x: hX, y: hY });
            }

            // Shuffle text targets so colors mix beautifully when forming text
            targets.text.sort(() => Math.random() - 0.5);
        }

        // --- Particle Object ---
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.radius = Math.random() * 1.8 + 1;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.friction = 0.90; // Tuned for rapid, crisp locking behavior
                this.ease = 0.09;
            }

            update(index) {
                if (currentState === 0) {
                    // Phase 0: Gather into Text "Joy ❤ Ticoh"
                    const target = targets.text[index % targets.text.length];
                    if (target) {
                        this.vx += (target.x - this.x) * this.ease;
                        this.vy += (target.y - this.y) * this.ease;
                        this.vx *= this.friction;
                        this.vy *= this.friction;
                    }
                } 
                else if (currentState === 1) {
                    // Phase 1: Break into small particles (Explosion)
                    this.vx *= 0.97;
                    this.vy *= 0.97;
                    
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                } 
                else if (currentState === 2) {
                    // Phase 2: Build a big heart (with subtle breathing beat effect)
                    const target = targets.heart[index % targets.heart.length];
                    if (target) {
                        const beat = 1 + Math.sin(Date.now() * 0.005) * 0.03;
                        const centerX = canvas.width / 2;
                        const centerY = canvas.height / 2;
                        
                        const dynamicX = centerX + (target.x - centerX) * beat;
                        const dynamicY = centerY + (target.y - centerY) * beat;

                        this.vx += (dynamicX - this.x) * (this.ease * 0.8);
