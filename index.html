<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upright 3D Particle Heart & Snake Halo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .text-container {
            position: absolute;
            top: 8%;
            text-align: center;
            z-index: 2;
            width: 100%;
            pointer-events: none;
        }
        h1 {
            color: #4da6ff;
            font-size: 3.5rem;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff, 0 0 40px #0044cc;
            animation: pulse 2s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from { text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff; transform: scale(1); }
            to { text-shadow: 0 0 20px #3399ff, 0 0 40px #0066ff, 0 0 60px #002288; transform: scale(1.02); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="text-container">
        <h1>I Love You</h1>
    </div>

    <script>
        // --- 1. SETUP THREE.JS SCENE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 26;
        camera.position.y = 1;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Particle Texture Helper (Bright soft stars)
        const createParticleTexture = (coreColor, glowColor) => {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.2, coreColor);
            grad.addColorStop(0.5, glowColor);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        };

        const heartTexture = createParticleTexture('rgba(100,200,255,0.85)', 'rgba(0,102,255,0.4)');
        const haloTexture = createParticleTexture('rgba(0,255,255,0.9)', 'rgba(0,150,255,0.3)');

        // --- 2. CREATE A DEFINED 3D SURFACE MESH OF STARS ---
        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        // Mathematical 2D classical heart boundary shape
        const heartShape = new THREE.Shape();
        
        // Populate standard heart curve path points
        const pointsCount = 150;
        for (let i = 0; i <= pointsCount; i++) {
            const t = (i / pointsCount) * Math.PI * 2;
            // Classical Heart curve math
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            
            if (i === 0) {
                heartShape.moveTo(x * 0.45, y * 0.45);
            } else {
                heartShape.lineTo(x * 0.45, y * 0.45);
            }
        }

        // Extrude geometry handles depth thickness without puffing or rounding it like a ball
        const extrudeSettings = {
            depth: 2.2,
            bevelEnabled: true,
            bevelSegments: 4,
            steps: 1,
            bevelSize: 0.3,
            bevelThickness: 0.4
        };

        const heartGeometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        heartGeometry.center(); // Perfect local pivoting axis alignment

        // Extracting vertices to display strictly as standalone STAR DOTS (No lines)
        const heartMaterial = new THREE.PointsMaterial({
            size: 0.42,
            map: heartTexture,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false,
            opacity: 0.95
        });

        const heartPoints = new THREE.Points(heartGeometry, heartMaterial);
        heartGroup.add(heartPoints);
        
        // Locking it upright perfectly (Adjusting orientation tweaks natively)
        heartGroup.position.y = 1.5;

        // --- 3. CREATE THE TIGHT SNAKE HALO ---
        const haloParticleCount = 350;
        const haloGeometry = new THREE.BufferGeometry();

        const haloMaterial = new THREE.PointsMaterial({
            size: 0.45,
            map: haloTexture,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });

        const snakeHalo = new THREE.Points(haloGeometry, haloMaterial);
        scene.add(snakeHalo);

        // --- 4. GLOWING BASE REFLECTION POOL ---
        const floorGeo = new THREE.PlaneGeometry(25, 25);
        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 256;
        floorCanvas.height = 256;
        const floorCtx = floorCanvas.getContext('2d');
        const floorGrad = floorCtx.createRadialGradient(128, 128, 0, 128, 128, 100);
        floorGrad.addColorStop(0, 'rgba(0, 130, 255, 0.45)');
        floorGrad.addColorStop(0.6, 'rgba(0, 40, 180, 0.12)');
        floorGrad.addColorStop(1, 'rgba(0,0,0,0)');
        floorCtx.fillStyle = floorGrad;
        floorCtx.fillRect(0, 0, 256, 256);

        const floorMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(floorCanvas),
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.position.y = -7.5;
        scene.add(floorMesh);

        // --- 5. ANIMATION LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Safe, clean rotation keeping the heart upright along the Y-axis
            heartGroup.rotation.y = elapsedTime * 0.45;
            
            // Weightless floating bobbing vertical oscillation
            heartGroup.position.y = 1.5 + Math.sin(elapsedTime * 1.3) * 0.35;

            // Soft starlight twinkle modification loop
            heartMaterial.size = 0.42 + Math.sin(elapsedTime * 4) * 0.04;

            // Dynamic slithering "Snake Halo" path right below the sharp point
            const haloPosArr = new Float32Array(haloParticleCount * 3);
            const haloRadius = 4.0; 

            for (let i = 0; i < haloParticleCount; i++) {
                const angle = (i / haloParticleCount) * Math.PI * 2 + (elapsedTime * 1.4);
                
                // Continuous snake slither up/down oscillation
                const snakeWave = Math.sin(i * 0.2 - elapsedTime * 8) * 0.35;
                const dynamicRadius = haloRadius + Math.cos(i * 0.1 + elapsedTime * 3) * 0.12;

                haloPosArr[i * 3] = Math.cos(angle) * dynamicRadius;
                // Positioned right under the sharp point hanging at the bottom
                haloPosArr[i * 3 + 1] = -5.8 + snakeWave; 
                haloPosArr[i * 3 + 2] = Math.sin(angle) * dynamicRadius;
            }
            snakeHalo.geometry.setAttribute('position', new THREE.BufferAttribute(haloPosArr, 3));

            renderer.render(scene, camera);
        }

        // Window resize adjustment
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
