<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Starfield Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const PARTICLE_COUNT = 2500; 
        let particles = [];
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let animationState = 0; 
        let stateTimer = 0;
        let baseHue = 340; 

        let nameTargets = [];
        let heartTargets = [];

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            generateTargets();
        });

        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * scale, y: -y * scale };
        }

        function generateTargets() {
            nameTargets = [];
            heartTargets = [];

            const memCanvas = document.createElement('canvas');
            const memCtx = memCanvas.getContext('2d');
            memCanvas.width = width;
            memCanvas.height = height;
            
            const fontSize = Math.min(width * 0.08, 70);
            memCtx.font = `bold ${fontSize}px sans-serif`;
            memCtx.fillStyle = '#fff';
            memCtx.textAlign = 'center';
            memCtx.textBaseline = 'middle';
            memCtx.fillText("Joy ❤ Ticoh", width / 2, height / 2);

            const imgData = memCtx.getImageData(0, 0, width, height).data;
            for (let y = 0; y < height; y += 4) {
                for (let x = 0; x < width; x += 4) {
                    const index = (y * width + x) * 4;
                    if (imgData[index + 3] > 128) {
                        nameTargets.push({ x: x, y: y });
                    }
                }
            }

            const heartScale = Math.min(width, height) * 0.015;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = (i / PARTICLE_COUNT) * Math.PI * 2;
                const innerScale = heartScale * (0.6 + Math.random() * 0.4); 
                const pt = getHeartPoint(t, innerScale);
                heartTargets.push({
                    x: pt.x + width / 2,
                    y: pt.y + height / 2
                });
            }
        }

        class Particle {
            constructor() {
                this.resetToStar();
            }

            resetToStar() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 1.5; // Slightly faster drift
                this.vy = (Math.random() - 0.5) * 1.5;
                this.size = Math.random() * 2 + 0.5;
                this.hueOffset = Math.random() * 40 - 20; 
                this.brightness = Math.random() * 40 + 60;
                this.alpha = Math.random() * 0.5 + 0.5;
                // Boosted morph speed so they assemble within the tighter 10-second window
                this.speed = 0.08 + Math.random() * 0.06; 
            }

            update() {
                baseHue += 0.001; // Faster color shifting
                
                if (animationState === 0) {
                    this.x += this.vx;
                    this.y += this.vy;

                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;

                    this.alpha += (Math.random() - 0.5) * 0.1;
                    if (this.alpha < 0.2) this.alpha = 0.2;
                    if (this.alpha > 1) this.alpha = 1;

                } else if (animationState === 1) {
                    if (nameTargets.length > 0) {
                        const target = nameTargets[Math.floor(this.index % nameTargets.length)];
                        this.x += (target.x - this.x) * this.speed;
                        this.y += (target.y - this.y) * this.speed;
                    }
                } else if (animationState === 2) {
                    if (heartTargets.length > 0) {
                        const target = heartTargets[this.index % heartTargets.length];
                        this.x += (target.x - this.x) * this.speed;
                        this.y += (target.y - this.y) * this.speed;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                
                const currentHue = (baseHue + this.hueOffset) % 360;
                ctx.fillStyle = `hsla(${currentHue}, 95%, ${this.brightness}%, ${this.alpha})`;
                
                ctx.shadowBlur = this.size * 4;
                ctx.shadowColor = `hsla(${currentHue}, 95%, 60%, 0.8)`;
                
                ctx.fill();
                ctx.restore();
            }
        }

        function init() {
            generateTargets();
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const p = new Particle();
                p.index = i;
                particles.push(p);
            }
        }

        function loop() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fillRect(0, 0, width, height);

            stateTimer++;

            // Accelerated Timeline (Assuming ~60 frames per second)
            if (animationState === 0 && stateTimer > 120) { 
                // State 0: Stars drift for 2 seconds (120 frames)
                animationState = 1;
                stateTimer = 0;
            } else if (animationState === 1 && stateTimer > 180) { 
                // State 1: Gather and hold text for 3 seconds (180 frames)
                animationState = 2;
                stateTimer = 0;
                
                // Aggressive explosion burst when breaking apart text
                particles.forEach(p => {
                    p.x += (Math.random() - 0.5) * 300;
                    p.y += (Math.random() - 0.5) * 300;
                });
            } else if (animationState === 2 && stateTimer > 180) { 
                // State 2: Scatter and form big heart for 3 seconds (180 frames)
                animationState = 0;
                stateTimer = 0;
                particles.forEach(p => p.resetToStar());
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>
