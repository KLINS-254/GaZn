<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Heart & Snake Ring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .text-container {
            position: absolute;
            top: 8%;
            text-align: center;
            z-index: 2;
            width: 100%;
            pointer-events: none;
        }
        h1 {
            color: #4da6ff;
            font-size: 3.5rem;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff, 0 0 40px #0044cc;
            animation: pulse 2s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from { text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff; transform: scale(1); }
            to { text-shadow: 0 0 20px #3399ff, 0 0 40px #0066ff, 0 0 60px #002288; transform: scale(1.02); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="text-container">
        <h1>I Love You</h1>
    </div>

    <script>
        // --- 1. SETUP THREE.JS SCENE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;
        camera.position.y = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- 2. CREATE 3D PARTICLE HEART ---
        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        const particleCount = 2500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const initialSizes = new Float32Array(particleCount);

        // Mathematical Formula for a solid 3D Heart Shape
        for (let i = 0; i < particleCount; i++) {
            // Sample uniformly across the heart's internal volume
            const u = Math.random() * Math.PI * 2;
            const v = (Math.random() - 0.5) * Math.PI;
            const r = Math.pow(Math.random(), 1/3); // Distributed evenly inside

            // Parametric 3D Heart Equations
            const x = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v);
            const y = (13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u));
            const z = 15 * Math.sin(u) * Math.sin(v); // Depth dimension

            // Apply scale and distribution factor
            positions[i * 3] = x * r * 0.5;
            positions[i * 3 + 1] = y * r * 0.5;
            positions[i * 3 + 2] = z * r * 0.5;

            initialSizes[i] = Math.random() * 2 + 1;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // Creating glowing particle texture via Canvas code natively
        const createParticleTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.3, 'rgba(0,150,255,0.8)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 16, 16);
            return new THREE.CanvasTexture(canvas);
        };

        const particleMaterial = new THREE.PointsMaterial({
            color: 0x33aaff,
            size: 0.4,
            map: createParticleTexture(),
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true
        });

        const heartParticles = new THREE.Points(geometry, particleMaterial);
        heartGroup.add(heartParticles);
        // Center alignment tweak
        heartGroup.position.y = 2; 

        // --- 3. CREATE THE SNAKE RING (TWISTING ORBIT) ---
        const ringParticleCount = 400;
        const ringGeometry = new THREE.BufferGeometry();
        const ringPositions = new Float32Array(ringParticleCount * 3);

        const ringMaterial = new THREE.PointsMaterial({
            color: 0x00ffff,
            size: 0.35,
            map: createParticleTexture(),
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });

        const snakeRing = new THREE.Points(ringGeometry, ringMaterial);
        scene.add(snakeRing);

        // --- 4. GLOWING BASE REFLECTION POOL ---
        const floorGeo = new THREE.PlaneGeometry(35, 35);
        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 256;
        floorCanvas.height = 256;
        const floorCtx = floorCanvas.getContext('2d');
        const floorGrad = floorCtx.createRadialGradient(128, 128, 0, 128, 128, 110);
        floorGrad.addColorStop(0, 'rgba(0, 102, 255, 0.45)');
        floorGrad.addColorStop(0.5, 'rgba(0, 50, 200, 0.15)');
        floorGrad.addColorStop(1, 'rgba(0,0,0,0)');
        floorCtx.fillStyle = floorGrad;
        floorCtx.fillRect(0, 0, 256, 256);

        const floorMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(floorCanvas),
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.position.y = -8;
        scene.add(floorMesh);


        // --- 5. ANIMATION LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // A. Smoothly rotate the 3D heart matrix
            heartGroup.rotation.y = elapsedTime * 0.4;
            // Gentle floating vertical bobbing
            heartGroup.position.y = 2 + Math.sin(elapsedTime * 1.5) * 0.5;

            // Subtle intrinsic shimmering of internal particles
            const positionsArr = heartParticles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                positionsArr[i * 3 + 1] += Math.sin(elapsedTime * 2 + i) * 0.002; // Small localized jitter
            }
            heartParticles.geometry.attributes.position.needsUpdate = true;

            // B. Animate the "Snake" Energy Ring
            // It twists dynamically in a wave pattern around the base floor
            const ringPosArr = new Float32Array(ringParticleCount * 3);
            const radius = 11; 

            for (let i = 0; i < ringParticleCount; i++) {
                // Spread points around a circle perimeter
                const angle = (i / ringParticleCount) * Math.PI * 2 + (elapsedTime * 0.8);
                
                // Introduce the wavy "snaking" calculation using sine variations over time
                const snakeWave = Math.sin(i * 0.08 - elapsedTime * 5) * 1.2;
                const dynamicRadius = radius + Math.cos(i * 0.05 + elapsedTime * 2) * 0.6;

                // X and Z map out the horizontal ring path
                ringPosArr[i * 3] = Math.cos(angle) * dynamicRadius;
                // Y maps out the vertical snake slither right above the floor reflection
                ringPosArr[i * 3 + 1] = -7.5 + snakeWave; 
                ringPosArr[i * 3 + 2] = Math.sin(angle) * dynamicRadius;
            }
            snakeRing.geometry.setAttribute('position', new THREE.BufferAttribute(ringPosArr, 3));

            renderer.render(scene, camera);
        }

        // Handle browser window scaling smoothly
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
