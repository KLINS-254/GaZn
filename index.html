<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trufennah Particle Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        // Resize Canvas
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Configuration
        const PARTICLE_COUNT = 12000; // High count optimized for performance
        const COLORS = [
            'rgba(255, 40, 80, 0.85)',   // Red
            'rgba(40, 255, 130, 0.85)',  // Green
            'rgba(180, 40, 255, 0.85)',  // Purple
            'rgba(255, 200, 40, 0.85)',  // Gold/Yellow
            'rgba(40, 210, 255, 0.85)'   // Cyan
        ];

        // Animation States: 0 = Text, 1 = Explode/Scatter, 2 = Heart
        let currentState = 0; 
        let stateTimer = 0;

        const targets = {
            text: [],
            heart: []
        };

        // --- Math & Shape Helpers ---
        
        // Heart Math Equation (Parametric)
        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * scale, y: -y * scale }; // Canvas Y is inverted
        }

        // Generate Target Coordinates for Text and Heart
        function generateTargets() {
            targets.text = [];
            targets.heart = [];

            // 1. Generate Text Targets using an offscreen canvas
            const offCanvas = document.createElement('canvas');
            const offCtx = offCanvas.getContext('2d');
            offCanvas.width = canvas.width;
            offCanvas.height = canvas.height;
            
            // Render text to sample pixels
            const fontSize = Math.min(canvas.width / 8, 120);
            offCtx.font = `bold ${fontSize}px sans-serif`;
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillStyle = 'white';
            offCtx.fillText("Trufennah", canvas.width / 2, canvas.height / 2);

            const imgData = offCtx.getImageData(0, 0, canvas.width, canvas.height).data;
            
            // Scan text pixels (step jumps to sample efficiently)
            const step = Math.max(1, Math.floor(Math.sqrt((canvas.width * canvas.height) / PARTICLE_COUNT) * 0.8));
            for (let y = 0; y < canvas.height; y += step) {
                for (let x = 0; x < canvas.width; x += step) {
                    const index = (y * canvas.width + x) * 4;
                    if (imgData[index + 3] > 128) { // If pixel is opaque enough
                        targets.text.push({ x: x, y: y });
                    }
                }
            }

            // 2. Generate Heart Targets
            const heartScale = Math.min(canvas.width, canvas.height) / 45;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // Distribute points across the heart edge and fill interior slightly
                const t = Math.PI * 2 * (i / PARTICLE_COUNT);
                const basePoint = getHeartPoint(t, heartScale);
                
                // Add minor random internal scattering so it's a solid/dense heart
                const innerFactor = Math.random() * 0.15 + 0.85; 
                const hX = canvas.width / 2 + basePoint.x * innerFactor;
                const hY = canvas.height / 2 + basePoint.y * innerFactor;
                
                targets.heart.push({ x: hX, y: hY });
            }

            // Shuffle text targets so colors mix beautifully when forming text
            targets.text.sort(() => Math.random() - 0.5);
        }

        // --- Particle Object ---
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.radius = Math.random() * 1.8 + 1;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.friction = 0.92;
                this.ease = 0.08;
            }

            update(index) {
                if (currentState === 0) {
                    // Phase 0: Gather into Text "Trufennah"
                    const target = targets.text[index % targets.text.length];
                    if (target) {
                        this.vx += (target.x - this.x) * this.ease;
                        this.vy += (target.y - this.y) * this.ease;
                        this.vx *= this.friction;
                        this.vy *= this.friction;
                    }
                } 
                else if (currentState === 1) {
                    // Phase 1: Break into small particles (Explosion)
                    // Apply constant drifting velocity after the explosion kick
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                    // Wrap around screen edges during drift
                    if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
                } 
                else if (currentState === 2) {
                    // Phase 2: Build a big heart (with subtle breathing beat effect)
                    const target = targets.heart[index % targets.heart.length];
                    if (target) {
                        // Create beating scale offset using sine wave
                        const beat = 1 + Math.sin(Date.now() * 0.005) * 0.04;
                        const centerX = canvas.width / 2;
                        const centerY = canvas.height / 2;
                        
                        // Scale outward from center
                        const dynamicX = centerX + (target.x - centerX) * beat;
                        const dynamicY = centerY + (target.y - centerY) * beat;

                        this.vx += (dynamicX - this.x) * (this.ease * 0.8);
                        this.vy += (dynamicY - this.y) * (this.ease * 0.8);
                        this.vx *= this.friction;
                        this.vy *= this.friction;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            explode() {
                // Give a random, high-velocity outward kick
                const angle = Math.random() * Math.PI * 2;
                const force = Math.random() * 15 + 5;
                this.vx = Math.cos(angle) * force;
                this.vy = Math.sin(angle) * force;
            }
        }

        // Initialize particles
        const particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        // Setup initial coordinates
        generateTargets();
        // Regenerate points if window dimensions change
        window.addEventListener('resize', generateTargets);

        // --- Main Animation Loop ---
        function animate() {
            // Semi-transparent background clear gives particles a nice motion-blur trail
            ctx.fillStyle = 'rgba(5, 5, 5, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stateTimer++;

            // State Machine transitions
            if (currentState === 0 && stateTimer > 160) {
                // Transition: Text -> Explode
                currentState = 1;
                stateTimer = 0;
                particles.forEach(p => p.explode());
            } 
            else if (currentState === 1 && stateTimer > 100) {
                // Transition: Explode -> Heart
                currentState = 2;
                stateTimer = 0;
            } 
            else if (currentState === 2 && stateTimer > 240) {
                // Transition: Heart -> Back to Text
                currentState = 0;
                stateTimer = 0;
            }

            // Update and draw particles
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(i);
                particles[i].draw();
            }

            requestAnimationFrame(animate);
        }

        // Kick off the loop
        animate();
    </script>
</body>
</html>
