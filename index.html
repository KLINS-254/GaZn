<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Puffy Particle Heart & Snake Halo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .text-container {
            position: absolute;
            top: 8%;
            text-align: center;
            z-index: 2;
            width: 100%;
            pointer-events: none;
        }
        h1 {
            color: #4da6ff;
            font-size: 3.5rem;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff, 0 0 40px #0044cc;
            animation: pulse 2s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from { text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff; transform: scale(1); }
            to { text-shadow: 0 0 20px #3399ff, 0 0 40px #0066ff, 0 0 60px #002288; transform: scale(1.02); }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="text-container">
        <h1>I Love You</h1>
    </div>

    <script>
        // --- 1. SETUP THREE.JS SCENE ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 24;
        camera.position.y = 1;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Particle Texture Helper (Soft star glow)
        const createParticleTexture = (coreColor, glowColor) => {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.2, coreColor);
            grad.addColorStop(0.5, glowColor);
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        };

        const heartTexture = createParticleTexture('rgba(100,200,255,0.85)', 'rgba(0,102,255,0.4)');
        const haloTexture = createParticleTexture('rgba(0,255,255,0.9)', 'rgba(0,150,255,0.3)');

        // --- 2. CREATE A PUFFY 3D DOTTED SURFACE HEART ---
        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        const heartParticleCount = 6000;
        const heartGeometry = new THREE.BufferGeometry();
        const positions = new Float32Array(heartParticleCount * 3);

        // Fill the coordinates using a customized parametric equation
        for (let i = 0; i < heartParticleCount; i++) {
            // Sample uniformly along the heart parameter paths
            const t = Math.random() * Math.PI * 2; // Perimeter angle
            const r = Math.sqrt(Math.random());    // Inner distribution factor

            // 1. Core 2D Heart Silhouette coordinates
            const x2D = 16 * Math.pow(Math.sin(t), 3) * 0.45;
            const y2D = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * 0.45;

            // Scale based on radius factor to fill the surface area uniformly
            let x = x2D * r;
            let y = y2D * r;

            // 2. Compute Depth (Z Axis) Puffy Curved displacement
            // The further away a point is from the boundaries (the closer r is to 0),
            // the more it swells outwards on the Z axis (both front and back).
            // We use a cosine formula based on distance to ensure a smooth, balloon-like bulge.
            const maxPuffDepth = 3.5; 
            const distFromEdge = 1.0 - r; // High in the center, 0 at the edge
            
            // Push half the particles to the front (+) and half to the back (-)
            const sideSign = (i % 2 === 0) ? 1 : -1;
            
            // Give it a smooth parabolic dome structure on both sides
            let z = Math.sin(distFromEdge * Math.PI / 2) * maxPuffDepth * sideSign;

            // Add slight organic starlight jitter so it looks dynamic
            const noiseFactor = (Math.random() - 0.5) * 0.15;
            positions[i * 3] = x + noiseFactor;
            positions[i * 3 + 1] = y + noiseFactor;
            positions[i * 3 + 2] = z + noiseFactor;
        }

        heartGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const heartMaterial = new THREE.PointsMaterial({
            size: 0.38,
            map: heartTexture,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false,
            opacity: 0.95
        });

        const heartPoints = new THREE.Points(heartGeometry, heartMaterial);
        heartGroup.add(heartPoints);
        
        // Hold the entire model upright and centered perfectly
        heartGroup.position.y = 1.5;

        // --- 3. CREATE THE TIGHT SNAKE HALO ---
        const haloParticleCount = 350;
        const haloGeometry = new THREE.BufferGeometry();

        const haloMaterial = new THREE.PointsMaterial({
            size: 0.45,
            map: haloTexture,
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });

        const snakeHalo = new THREE.Points(haloGeometry, haloMaterial);
        scene.add(snakeHalo);

        // --- 4. GLOWING BASE REFLECTION POOL ---
        const floorGeo = new THREE.PlaneGeometry(25, 25);
        const floorCanvas = document.createElement('canvas');
        floorCanvas.width = 256;
        floorCanvas.height = 256;
        const floorCtx = floorCanvas.getContext('2d');
        const floorGrad = floorCtx.createRadialGradient(128, 128, 0, 128, 128, 100);
        floorGrad.addColorStop(0, 'rgba(0, 130, 255, 0.45)');
        floorGrad.addColorStop(0.6, 'rgba(0, 40, 180, 0.12)');
        floorGrad.addColorStop(1, 'rgba(0,0,0,0)');
        floorCtx.fillStyle = floorGrad;
        floorCtx.fillRect(0, 0, 256, 256);

        const floorMat = new THREE.MeshBasicMaterial({
            map: new THREE.CanvasTexture(floorCanvas),
            blending: THREE.AdditiveBlending,
            transparent: true,
            depthWrite: false
        });
        const floorMesh = new THREE.Mesh(floorGeo, floorMat);
        floorMesh.rotation.x = -Math.PI / 2;
        floorMesh.position.y = -7.5;
        scene.add(floorMesh);

        // --- 5. ANIMATION LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Safe upright rotation along the vertical Y-axis
            heartGroup.rotation.y = elapsedTime * 0.45;
            
            // Weightless floating vertical bobbing loop
            heartGroup.position.y = 1.5 + Math.sin(elapsedTime * 1.3) * 0.35;

            // Cosmic twinkle sparkle frequency
            heartMaterial.size = 0.38 + Math.sin(elapsedTime * 4) * 0.04;

            // Animate the slithering "Snake Halo" ring right under the sharp bottom tip
            const haloPosArr = new Float32Array(haloParticleCount * 3);
            const haloRadius = 4.0; 

            for (let i = 0; i < haloParticleCount; i++) {
                const angle = (i / haloParticleCount) * Math.PI * 2 + (elapsedTime * 1.4);
                
                // Fast snake-like up and down undulation wave
                const snakeWave = Math.sin(i * 0.2 - elapsedTime * 8) * 0.35;
                const dynamicRadius = haloRadius + Math.cos(i * 0.1 + elapsedTime * 3) * 0.12;

                haloPosArr[i * 3] = Math.cos(angle) * dynamicRadius;
                // Anchor the ring height cleanly below the lower tip (-5.8 position)
                haloPosArr[i * 3 + 1] = -5.8 + snakeWave; 
                haloPosArr[i * 3 + 2] = Math.sin(angle) * dynamicRadius;
            }
            snakeHalo.geometry.setAttribute('position', new THREE.BufferAttribute(haloPosArr, 3));

            renderer.render(scene, camera);
        }

        // Window resize scaling adjustment
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
