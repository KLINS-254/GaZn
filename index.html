<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You - Snaking Particle Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .text-container {
            position: absolute;
            top: 10%;
            text-align: center;
            z-index: 2;
            width: 100%;
            pointer-events: none;
        }
        h1 {
            color: #4da6ff;
            font-family: 'Arial', sans-serif;
            font-size: 3.5rem;
            font-style: italic;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff, 0 0 40px #0044cc;
            animation: pulse 2s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from {
                text-shadow: 0 0 10px #0066ff, 0 0 20px #0066ff, 0 0 30px #0044cc;
                transform: scale(1);
            }
            to {
                text-shadow: 0 0 15px #3399ff, 0 0 30px #0066ff, 0 0 50px #0044cc, 0 0 70px #002288;
                transform: scale(1.03);
            }
        }
    </style>
</head>
<body>

    <div class="text-container">
        <h1>I Love You</h1>
    </div>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Point class from original image layout
        var Point = (function () {
            function Point(x, y) {
                this.x = (typeof x !== 'undefined') ? x : 0;
                this.y = (typeof y !== 'undefined') ? y : 0;
            }
            Point.prototype.clone = function () {
                return new Point(this.x, this.y);
            };
            return Point;
        })();

        const particles = [];
        const particleCount = 750; // Slighter higher density for smoother snake lines
        const baseColor = { r: 60, g: 150, b: 255 }; 

        // Heart mathematics
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return new Point(x * 12, -y * 12);
        }

        // Initialize particles
        for (let i = 0; i < particleCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const targetPos = getHeartPoint(t);
            const innerScatter = Math.random(); // Distributes particles throughout inner structure
            
            particles.push({
                baseX: targetPos.x * innerScatter,
                baseY: targetPos.y * innerScatter,
                x: targetPos.x * innerScatter,
                y: targetPos.y * innerScatter,
                size: Math.random() * 2 + 0.6,
                alpha: Math.random(),
                vs: Math.random() * 0.03 + 0.015,
                phaseOffset: Math.random() * Math.PI * 2 // Unique starting wave position for variation
            });
        }

        let time = 0;

        function animate() {
            // Adjust opacity trailing for a subtle motion blur "slither" tail
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height * 0.45;
            time += 0.04; // Controls speed of the slithering snake animation

            // 1. Base Reflection Pool Glow
            const gradient = ctx.createRadialGradient(
                centerX, centerY + 280, 10, 
                centerX, centerY + 280, 160
            );
            gradient.addColorStop(0, 'rgba(0, 132, 255, 0.35)');
            gradient.addColorStop(0.5, 'rgba(0, 102, 255, 0.12)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 270, 170, 25, 0, 0, Math.PI * 2);
            ctx.fill();

            // 2. Render Heart with Wave-Slither motion
            particles.forEach(p => {
                
                // "Snake" wave math: Creates horizontal ripples traveling from top to bottom
                // Math.sin(time + Y-coordinate factor) * wave frequency 
                const snakeWaveX = Math.sin(time + (p.baseY * 0.04) + p.phaseOffset * 0.1) * 15;
                const snakeWaveY = Math.cos(time + (p.baseX * 0.04)) * 8;

                // Combine the heart structure coordinates with the live wavy slither offsets
                const targetX = p.baseX + snakeWaveX;
                const targetY = p.baseY + snakeWaveY;

                // Interpolate positioning smoothly (Lerping animation)
                p.x += (targetX - p.x) * 0.1;
                p.y += (targetY - p.y) * 0.1;

                // Constant twinkling twinkle code
                p.alpha += p.vs;
                if (p.alpha > 1 || p.alpha < 0.2) {
                    p.vs = -p.vs;
                }

                // Render individual particle glow maps
                ctx.fillStyle = `rgba(${baseColor.r}, ${baseColor.g + Math.floor(Math.random()*40)}, 255, ${p.alpha})`;
                ctx.shadowBlur = Math.random() * 8 + 3;
                ctx.shadowColor = 'rgba(0, 110, 255, 0.8)';
                
                ctx.beginPath();
                ctx.arc(centerX + p.x, centerY + p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Performance clean up
            ctx.shadowBlur = 0;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
