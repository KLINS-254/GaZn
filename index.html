<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Particle Heart Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas sizing
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Animation configuration
        const config = {
            heartScale: 14,          // Size of the heart
            particleCount: 4,       // Particles spawned per frame during drawing
            color: 'hsl(280, 100%, 70%)', // Purple/Pink neon theme matching the images
            glowColor: 'rgba(180, 50, 255, 0.4)'
        };

        // Heart parametric equation helpers
        // Draws from top-center, arching around symmetrically using an angle 't'
        function getHeartPoint(t) {
            // Standard parametric heart formula shifted to trace beautifully
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x, y };
        }

        class Particle {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                // Add explosion randomness to match the scattered dust look
                this.vx = (Math.random() - 0.5) * 6 + (targetX - x) * 0.05;
                this.vy = (Math.random() - 0.5) * 6 + (targetY - y) * 0.05;
                this.size = Math.random() * 2 + 1;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                // Simulate drag/friction slowing them down into position
                this.vx *= 0.95;
                this.vy *= 0.95;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = config.color;
                ctx.fillStyle = config.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        let heartPoints = [];
        let traceIndex = 0;
        
        // Pre-calculate the drawing path tracing from top to bottom
        // We split it into two halves to draw simultaneously from the top center down to the point
        for (let t = 0; t <= Math.PI; t += 0.01) {
            heartPoints.push(t);
        }

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2 - 30;
        const finalizedPath = [];

        function animate() {
            // Creates the "trailing dust" effect by not clearing the screen entirely
            ctx.fillStyle = 'rgba(5, 5, 8, 0.12)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 - 20;

            // 1. Draw/Trace Phase
            if (traceIndex < heartPoints.length) {
                const t = heartPoints[traceIndex];
                
                // Left Arc point
                const ptLeft = getHeartPoint(-t);
                const xl = centerX + ptLeft.x * config.heartScale;
                const yl = centerY + ptLeft.y * config.heartScale;

                // Right Arc point
                const ptRight = getHeartPoint(t);
                const xr = centerX + ptRight.x * config.heartScale;
                const yr = centerY + ptRight.y * config.heartScale;

                // Save for the permanent solid line glow later
                finalizedPath.push({xl, yl, xr, yr});

                // Spawn burst particles at the current leading edges
                for (let i = 0; i < config.particleCount; i++) {
                    particles.push(new Particle(xl, yl, xl, yl));
                    particles.push(new Particle(xr, yr, xr, yr));
                }

                // Add a bright leading "head" spark
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#fff';
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(xl, yl, 4, 0, Math.PI*2);
                ctx.arc(xr, yr, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();

                traceIndex += 2; // Adjust speed of tracing here
            }

            // 2. Update and draw burst particles
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            // 3. Draw the forming neon solid core
            if (finalizedPath.length > 0) {
                ctx.save();
                ctx.lineWidth = 3;
                ctx.strokeStyle = config.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = config.color;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Draw Left Side
                ctx.beginPath();
                finalizedPath.forEach((pt, i) => {
                    if(i === 0) ctx.moveTo(pt.xl, pt.yl);
                    else ctx.lineTo(pt.xl, pt.yl);
                });
                ctx.stroke();

                // Draw Right Side
                ctx.beginPath();
                finalizedPath.forEach((pt, i) => {
                    if(i === 0) ctx.moveTo(pt.xr, pt.yr);
                    else ctx.lineTo(pt.xr, pt.yr);
                });
                ctx.stroke();
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        // Start the animation
        animate();
    </script>
</body>
</html>
